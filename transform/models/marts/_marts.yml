version: 2

models:
  - name: mart_network_health
    description: >
      Gold layer. One row per region summarising fetch reliability over the last
      `health_window_hours` (24h by default). Backs the Network Health scorecards.
      Ordered by reliability_score descending, but consumers must not rely on a
      view's inner ordering - `db.get_network_health_summary` re-applies it.
    columns:
      - name: region
        description: Transit region. The grain of this model.
        tests:
          - not_null
          - unique
          # The production contract is exactly the 14 canonical regions from
          # `src/config.example.py`. The CI seed fixture's synthetic region is
          # admitted only under the `ci` target, so `dev`/prod stay strict.
          - accepted_values:
              values: "{{ var('canonical_regions') + (['TestRegion', 'DeadFeed', 'QuietFeed', 'MixedFeed', 'ThrottledFeed'] if target.name == 'ci' else []) }}"
      - name: total_fetches
        description: Number of fetch cycles recorded for the region inside the window.
      - name: scoreable_fetches
        description: Fetches in the window that say something about agency reliability (excludes NO_FEED and THROTTLED).
        tests:
          - not_null
      - name: feed_unavailable
        description: True when the window contains no scoreable fetches — the feed is gone upstream.
        tests:
          - not_null
      - name: no_feed_count
        description: >
          Fetch cycles in the window whose status was NO_FEED (HTTP 404). Lets the
          page say why a feed is unavailable instead of assuming "withdrawn".
        tests:
          - not_null
      - name: throttled_count
        description: >
          Fetch cycles in the window whose status was THROTTLED (HTTP 429) - our own
          rate limiting, not an agency fault.
        tests:
          - not_null
      - name: dropout_count
        description: >
          Scoreable fetch cycles inside the window where the API returned zero
          vehicles. Informational only - it is not an input to reliability_score,
          and it excludes NO_FEED/THROTTLED cycles so it cannot contradict the
          score displayed beside it.
      - name: reporting_rate
        description: >
          Mean ratio of vehicles inserted to vehicles received, over the cycles that
          received anything. NULL when no cycle in the window received anything -
          the rate is then undefined, not zero, and reliability_score renormalises.
        tests:
          - accepted_range: {min_value: 0, max_value: 1}
      - name: availability
        description: >
          Share of scoreable fetches (excludes NO_FEED/THROTTLED) that were not
          ERROR. total_dropout does NOT count against this - an EMPTY fetch (feed
          answered, zero vehicles running) is not an error. NULL when
          feed_unavailable (no scoreable fetches in the window).
      - name: avg_data_lag_seconds
        description: >
          Mean data lag across the window's scoreable fetch cycles, in seconds.
          NO_FEED/THROTTLED cycles log a lag of 0 they never measured, so they are
          excluded here just as they are from the score.
      - name: last_fetch_timestamp
        description: Unix timestamp of the most recent fetch cycle inside the window.
      - name: reliability_score
        description: >
          Composite 0-100 score - 40% reporting rate, 40% availability, 20% data
          freshness. Computed by the shared `reliability_score` macro. When no cycle
          in the window received anything (reporting_rate is NULL) the reporting term
          is dropped and the remaining weights renormalised, via
          `reliability_score_without_reporting` - the same rule
          `mart_region_health_trend` applies per row, so the two marts agree. NULL
          when feed_unavailable (no scoreable fetches in the window to score).
        tests:
          - accepted_range: {min_value: 0, max_value: 100}

  - name: mart_region_health_trend
    description: >
      Gold layer. One row per region per fetch cycle with a per-row reliability
      score, using the same `reliability_score` macro as `mart_network_health`.
      Deliberately unfiltered by time - the app applies its own window.
    tests:
      # Documented grain: one row per region per fetch cycle.
      - unique_combination_of_columns:
          combination_of_columns: [region, fetch_timestamp]
    columns:
      - name: region
        description: Transit region. With `fetch_timestamp`, forms the grain of this model.
        tests: [not_null]
      - name: fetch_timestamp
        description: Unix timestamp of the fetch cycle. With `region`, forms the grain of this model.
        tests: [not_null]
      - name: vehicles_received
        description: Raw vehicle count returned by the API before any validation.
      - name: vehicles_rejected
        description: Vehicles discarded for bad coordinates or stale/future timestamps.
      - name: vehicles_inserted
        description: Vehicles actually written to `live_buses` after de-duplication.
      - name: avg_data_lag_seconds
        description: Mean data lag for this single fetch cycle, in seconds.
      - name: max_data_lag_seconds
        description: Worst per-vehicle data lag in this single fetch cycle, in seconds.
      - name: total_dropout
        description: True when the API returned zero vehicles for the region in this cycle.
      - name: reliability_score
        description: >
          Composite 0-100 score for this single fetch cycle - 40% reporting rate,
          40% availability (ERROR = 0, otherwise 1, including EMPTY), 20% data
          freshness. When the cycle received nothing the reporting rate is
          undefined, so that term is dropped and the remaining weights
          renormalised (`reliability_score_without_reporting`) - matching what
          `mart_network_health` does when avg() skips the NULL, so the sparkline
          and the scorecard above it cannot tell different stories. NULL when the
          row isn't scoreable (NO_FEED/THROTTLED), so it's absent from the trend
          line rather than plotted as a zero.
        tests:
          - accepted_range: {min_value: 0, max_value: 100}

  - name: mart_region_vehicle_counts
    description: >
      Gold layer. Distinct vehicles seen per region over the last `retention_days`.
      Single source of truth for the Analytics "Buses by Region" bar and the
      "Regional Distribution" pie.
    columns:
      - name: region
        description: Transit region. The grain of this model.
        tests: [not_null, unique]
      - name: unique_vehicles
        description: Count of distinct `vehicle_id` values seen in the retention window.
        tests:
          - accepted_range: {min_value: 0}
