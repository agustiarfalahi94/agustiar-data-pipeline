version: 2

models:
  - name: stg_vehicle_positions
    columns:
      - name: vehicle_id
        tests: [not_null]
      - name: speed_kmh
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 120
  - name: stg_fetch_quality
    columns:
      - name: fetch_timestamp
        tests: [not_null]
      - name: region
        tests: [not_null]
