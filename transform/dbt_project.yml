name: 'transit_transform'
version: '2.2.0'
config-version: 2
profile: 'transit'

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Widened in CI so fixed-timestamp seeds fall inside the windows.
  health_window_hours: 24
  retention_days: 7
  # The 14 canonical regions - must stay in sync with REGIONS in src/config.example.py.
  canonical_regions:
    - 'Rapid Bus KL'
    - 'Rapid Bus MRT Feeder'
    - 'Rapid Bus Kuantan'
    - 'Rapid Bus Penang'
    - 'KTM Berhad'
    - 'myBAS Kangar'
    - 'myBAS Alor Setar'
    - 'myBAS Kota Bharu'
    - 'myBAS Kuala Terengganu'
    - 'myBAS Ipoh'
    - 'myBAS Seremban'
    - 'myBAS Melaka'
    - 'myBAS Johor'
    - 'myBAS Kuching'

models:
  transit_transform:
    staging:
      +materialized: view
    marts:
      +materialized: view

seeds:
  transit_transform:
    # The seeds are CI fixtures named identically to the real app tables
    # (`live_buses`, `fetch_quality_log`). Loading them against a real database
    # would TRUNCATE ingested history, so they are enabled only on the `ci`
    # target. Use `--target ci` (throwaway DB) whenever seeds are needed.
    +enabled: "{{ target.name == 'ci' }}"
